[package]
name = "solitaire-foxrc"
version = "0.1.0"
authors = ["Spheniscine <spheniscine@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0", features = [] }
enum-map = "3.1.0"
enumset = "1.1.14"
extend = "1.2.0"
serde = "1.0.229"
serde_json5 = "0.2.1"
serde_tuple = "1.1.3"
strum = "0.28.0"
strum_macros = "0.28.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
